[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yask"
version = "0.1.0"
description = "Yet Another Simple Kanban board (yask)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "mcp",
    "httpx",
    "pydantic",
]

[project.scripts]
yask = "yask.cli:main"

[tool.setuptools.packages.find]
include = ["yask*"]

[tool.setuptools.package-data]
yask = [
    "web/*",
    "web/js/*",
]
