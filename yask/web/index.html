<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yask — yet another simple kanban</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2' width='4' height='12' rx='1' fill='%237c6cf0'/%3E%3Crect x='6' y='2' width='4' height='8' rx='1' fill='%234f9cf0'/%3E%3Crect x='11' y='2' width='4' height='5' rx='1' fill='%233fbf7f'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand" title="yet another simple kanban">yask</div>
      <nav id="project-list" aria-label="Projects"></nav>
      <form id="new-project-form" class="sidebar-form">
        <input id="new-project-name" type="text" placeholder="New project…" autocomplete="off">
        <button type="submit" class="btn" aria-label="Create project">+</button>
      </form>
      <section id="roles-panel" class="roles-panel" hidden aria-label="User-story roles">
        <div class="roles-title">Roles</div>
        <div id="roles-list" class="roles-list"></div>
        <form id="new-role-form" class="sidebar-form roles-add">
          <input id="new-role-name" type="text" placeholder="Add a role…" autocomplete="off">
          <button type="submit" class="btn" aria-label="Add role">+</button>
        </form>
      </section>
    </aside>
    <main id="main">
      <header id="topbar">
        <button id="sidebar-toggle" class="icon-btn" title="Hide sidebar" aria-label="Toggle sidebar"></button>
        <h1 id="project-name">yask</h1>
        <input id="search" type="search" placeholder="Search tasks…" autocomplete="off">
        <label class="switch" title="Show archived tasks">
          <input type="checkbox" id="show-archived">
          <span class="switch-label">Archived</span>
        </label>
        <select id="label-filter" title="Filter board by label" aria-label="Filter by label">
          <option value="">Any label</option>
        </select>
        <select id="min-font" title="Minimum font size" aria-label="Minimum font size">
          <option value="0">Auto</option>
          <option value="10">10pt</option>
          <option value="11">11pt</option>
          <option value="12">12pt</option>
          <option value="14">14pt</option>
          <option value="16">16pt</option>
          <option value="18">18pt</option>
        </select>
        <button id="refresh" class="icon-btn" title="Refresh board" aria-label="Refresh board">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M8 3a5 5 0 0 0-5 5h1.5a3.5 3.5 0 0 1 7 0H11a5 5 0 0 0-5-5zm0 4a1 1 0 0 1 1 1h3a1 1 0 0 1-1 1H9a2 2 0 1 1 0-4z" />
          </svg>
        </button>
        <button id="theme-toggle" class="icon-btn" title="Toggle dark / light theme" aria-label="Toggle theme"></button>
      </header>
      <div id="board" aria-label="Board"></div>
      <section id="search-results" hidden aria-label="Search results"></section>
      <div id="empty-state" hidden>
        <p id="empty-state-text"></p>
      </div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
